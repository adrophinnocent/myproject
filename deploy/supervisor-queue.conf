; Supervisor config for the Twina Safaris queue worker (Linux production).
; Install: sudo cp deploy/supervisor-queue.conf /etc/supervisor/conf.d/twina-queue.conf
;          sudo supervisorctl reread && sudo supervisorctl update
; Adjust the paths/user to your server before enabling.

[program:twina-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/twinasafaris/artisan queue:work database --sleep=3 --tries=3 --timeout=600 --max-time=3600
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/twinasafaris/storage/logs/queue-worker.log
stopwaitsecs=600
